<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../look.css">
<style>
  #url-mask { left: 168px; top: 380px; width: 1584px; height: 150px; }
  #url-mask > span { display: inline-block; font-size: 128px; line-height: 150px; color: var(--shadow); }
  #underline { position: absolute; left: 168px; top: 540px; height: 12px; background: var(--accent); transform-origin: 0 50%; }
  #tag-mask { left: 168px; top: 584px; width: 1584px; height: 84px; }
  #tag-mask > span { font-size: 64px; line-height: 84px; color: var(--shadow); }
  #flash img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; visibility: hidden; }
</style>
</head>
<body>
<div id="scene">
  <div id="masthead">Director's Lookbook</div>
  <div id="rule"></div>
  <div class="mask" id="url-mask"><span class="title">directorslookbook.app</span></div>
  <div id="underline"></div>
  <div class="mask" id="tag-mask"><span>Named looks for image, video and music prompts.</span></div>
</div>
<div id="flash">
  <img src="../assets/looks/botanical-nest-full.jpg" alt="">
  <img src="../assets/looks/decaying-halftone-full.jpg" alt="">
  <img src="../assets/looks/plinth-still-life-full.jpg" alt="">
</div>
<script type="module">
import { prepare, slide, span, smooth } from './kit.js';
const $ = (s) => document.querySelector(s);
const D = 2.948, AT = 12.767;   // the end card: the three looks flash on half beats, then the address lands
const flashes = [...document.querySelectorAll('#flash img')];
let B;
window.film = {
  duration: D,
  ready: prepare(AT).then((b) => {
    B = b;
    $('#underline').style.width = `${$('#url-mask > span').offsetWidth}px`;   // the address's own width, not its mask's
  }),
  frame(t) {
    flashes.forEach((im, k) => {
      const on = t >= B(k * 0.5) && t < B(k * 0.5 + 0.5);
      im.style.visibility = on ? 'visible' : 'hidden';
      im.style.transform = `scale(${(1.06 - 0.06 * smooth(span(t, B(k * 0.5), B(k * 0.5 + 0.5)))).toFixed(4)})`;
    });
    slide($('#url-mask > span'), t, B(1.5));
    $('#underline').style.transform = `scaleX(${smooth(span(t, B(2), B(2.5)))})`;
    slide($('#tag-mask > span'), t, B(2.25));
  },
};
</script>
</body>
</html>
